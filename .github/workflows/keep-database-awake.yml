# Supabase pauses free projects after 7 days with no activity.
# This sends one tiny read request every three days so Hindsight stays online.
name: Keep database awake

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from Supabase
        run: |
          curl -fsS "https://epzhgdblwtnejufmdykb.supabase.co/rest/v1/properties?select=id&limit=1" \
            -H "apikey: sb_publishable_n2EL3kGm9WhxQ5I5ELYO5w_nbSIcEpC" > /dev/null

<!DOCTYPE html>
<html lang="en-GB" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hindsight | Unfiltered UK rental reviews</title>
    <meta name="description" content="Unfiltered reviews from real UK tenants. Search a postcode and see what previous tenants said about damp, heating, the landlord and the deposit before you sign." />
    <meta name="theme-color" content="#0B1A2E" />

    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hindsight" />

    <link rel="canonical" href="https://hindsight-reviews.netlify.app/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hindsight-reviews.netlify.app/" />
    <meta property="og:title" content="Hindsight | Unfiltered UK rental reviews" />
    <meta property="og:description" content="Check a rental before you sign. Real tenants score damp, heating, landlords and deposits." />
    <meta property="og:image" content="https://hindsight-reviews.netlify.app/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />

    <script>
      /* Apply the saved or system theme before the page paints, so there is no flash. */
      (function () {
        try {
          var saved = localStorage.getItem("hindsight-theme") || "system";
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = saved === "system" ? (dark ? "dark" : "light") : saved;
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Hindsight needs JavaScript switched on.</noscript>
    <div id="root"></div>
    <!-- Netlify reads these at deploy time. Submissions are emailed privately to the site owner. -->
    <form name="contact" data-netlify="true" netlify-honeypot="company" hidden>
      <input type="text" name="name" /><input type="email" name="email" /><input type="text" name="topic" />
      <textarea name="message"></textarea><input type="text" name="company" /><input type="hidden" name="subject" />
    </form>
    <form name="new-review" data-netlify="true" hidden>
      <input type="text" name="property" /><input type="text" name="author" /><input type="text" name="summary" />
      <input type="text" name="status" /><input type="hidden" name="subject" />
    </form>
    <form name="new-reply" data-netlify="true" hidden>
      <input type="text" name="property" /><input type="text" name="review" /><input type="text" name="responder" />
      <input type="hidden" name="subject" />
    </form>
    <form name="review-report" data-netlify="true" hidden>
      <input type="text" name="review_id" /><input type="text" name="property" /><input type="text" name="reason" />
      <textarea name="details"></textarea><input type="email" name="email" /><input type="hidden" name="subject" />
    </form>
  </body>
</html>
